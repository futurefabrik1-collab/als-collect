name: build

# Tests on macOS + Windows; an EXPERIMENTAL, untested Windows build attached to
# the release for tag pushes.  The macOS DMG is signed + notarized locally
# (app/release-macos.sh), never in CI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the Windows zip to this existing release (e.g. v0.2.0); empty = artifact only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt
      - run: python test_als_collect.py
      - run: python test_app.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt
      - run: python test_als_collect.py
      - run: python test_app.py
      - name: Build (PyInstaller, onedir)
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build app/als_collect_win.spec
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item app/WINDOWS-README.txt "dist/ALS Collect/READ ME FIRST (experimental).txt"
          Compress-Archive -Path "dist/ALS Collect" -DestinationPath ALS-Collect-windows-experimental.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ALS-Collect-windows-experimental
          path: ALS-Collect-windows-experimental.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        run: gh release upload "$TAG" ALS-Collect-windows-experimental.zip --clobber
